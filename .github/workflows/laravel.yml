name: Laravel Package Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
        include:
          - laravel: "12"
            testbench: "10"
          - laravel: "13"
            testbench: "11"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.4" ]
        laravel: [ "12", "13" ]
        db: [ "mysql", "pgsql" ]
        include:
          - laravel: "12"
            testbench: "10"
          - laravel: "13"
            testbench: "11"
          - db: "mysql"
            port: 3306
            username: "root"
          - db: "pgsql"
            port: 5432
            username: "postgres"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      # phpunit.xml only sets DB_* when they are not already in the environment.
      - name: Run tests
        run: vendor/bin/phpunit --testdox
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
